  "bin/qwen3_asr_worker",
  "engines/asr_thinker_full_int4_b1/llm.engine",
  "engines/asr_thinker_full_int4_b2/llm.engine",
  "engines/asr_audio_encoder/audio/audio_encoder.engine",
