[upstream]
version = "v0.9.1"
pin = "7f061f21f0a581ba234a1e233c9315b89d8e47d6"
remote = "https://github.com/NVIDIA/TensorRT-Edge-LLM.git"

[patches]
directory = "patches/v091-candidate"
first = "0001"
last = "0041"
count = 41

[target]
device = "jetson-orin-nx"
sm = "87"
cuda = "12.6"
tensorrt = "10.3"
l4t = "36.4.3"
embedded_target = "jetson-orin"
aarch64_build = true

[build]
type = "Release"
enable_cute_dsl = "OFF"
worker = "qwen3_asr_worker"

[model]
id = "Qwen/Qwen3-ASR-0.6B"
precision = "int4_awq"
components = ["thinker", "audio_encoder"]
batch_sizes = [1, 2]
max_input_len = 1024
max_kv_cache_capacity = 1536
long_context_opt_in_env = "ASR_LONG_CONTEXT"

[artifacts]
root = "/opt/edgellm-v091"
required = [
  "libNvInfer_edgellm_plugin.so",
  "bin/qwen3_asr_worker",
  "engines/asr_thinker_full_int4_b1/llm.engine",
  "engines/asr_thinker_full_int4_b2/llm.engine",
  "engines/asr_audio_encoder/audio/audio_encoder.engine",
]
provenance_required = true
sha256_required = true
