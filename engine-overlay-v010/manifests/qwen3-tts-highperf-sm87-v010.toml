[upstream]
version = "v0.10.0"
pin = "71dd1bae032e70771265917ec74d3ff4cad07a10"
remote = "https://github.com/NVIDIA/TensorRT-Edge-LLM.git"

[proposed_upstream_patches]
directory = "patches/upstream-v010-prs"
series = "patches/upstream-v010-prs/series"
lock = "patches/upstream-v010-prs/LOCK"
checksums = "patches/upstream-v010-prs/SHA256SUMS"
count = 4
series_sha256 = "9c366ab2e23e79e100d0d209edad0f5137feed1f88fbaab29b8959b913ede5ee"
lock_sha256 = "1d34836757eeac6e423ff7b97261f127a93ba6edc4634cbfa5387f7fda49d9f3"
checksums_sha256 = "7d78dbdd53065b3601dc9cb7fc0c868d0641167e620ba4c219087e2497608144"

[patches]
directory = "patches/v010-candidate"
series = "patches/v010-candidate/series"
checksums = "patches/v010-candidate/SHA256SUMS"
count = 32
sparse_numbering = true
series_sha256 = "8f6d316faf54efbbb59c3b40089bc093f7c138c0d33e2ec79357467348632019"
checksums_sha256 = "4c8f9ef64861e499b4252b87f74d53c79407aa1b70f148cfba5259e23f4c05b1"

[target]
device = "jetson-orin-nx"
sm = "87"
cuda = "12.6"
tensorrt = "10.3"
l4t = "36.4.3"
jetpack = "6.2"
embedded_target = "jetson-orin"
aarch64_build = true

[build]
type = "Release"
enable_cute_dsl = "fmha"
worker = "qwen3_tts_streaming_worker"
max_batch_size = 1
max_input_len = 1024
max_kv_cache_capacity = 1536
n2_opt_in_env = "TTS_MAX_BATCH_SIZE=2"

[model.customvoice]
id = "Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice"
revision = "85e237c12c027371202489a0ec509ded67b5e4b5"
precision = "int4"
upstream_supported_precision = false
product_extension = true
int4_gemm_plugin_version = 1
components = ["talker", "code_predictor", "code2wav"]
required_driver_env = "EDGELLM_TTS_INT4_DRIVER"
required_driver_outputs = ["DRIVER_REVISION", "PROVENANCE.md"]

[model.base]
id = "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
revision = "5d83992436eae1d760afd27aff78a71d676296fc"
precision = "int4"
upstream_supported_precision = false
product_extension = true
int4_gemm_plugin_version = 1
stage2_source = "wip/native-int4-talker"
stage2_revision = "ff2318e66525365b2ed9f55811bf5d2381280ed8"
components = ["talker", "code_predictor", "code2wav", "speaker_encoder", "speech_tokenizer_encoder"]
native_v010_components = ["code_predictor", "code2wav", "speaker_encoder", "speech_tokenizer_encoder"]
required_driver = "drivers/export-qwen3-tts-int4-v010.sh"
required_stage2_env = "TTS_BASE_INT4_STAGE2_CHECKPOINT"

[artifacts]
root = "/opt/edgellm-v010"
required = [
  "libNvInfer_edgellm_plugin.so",
  "bin/qwen3_tts_streaming_worker",
  "engines/qwen3-tts-int4/talker/llm.engine",
  "engines/qwen3-tts-int4/talker/DRIVER_REVISION",
  "engines/qwen3-tts-int4/talker/PROVENANCE.md",
  "engines/qwen3-tts-int4/code_predictor/llm.engine",
  "engines/qwen3-tts-int4/code2wav/code2wav.engine",
  "engines/qwen3-tts-base-int4/talker/llm.engine",
  "engines/qwen3-tts-base-int4/talker/DRIVER_REVISION",
  "engines/qwen3-tts-base-int4/talker/PROVENANCE.md",
  "engines/qwen3-tts-base-int4/code_predictor/llm.engine",
  "engines/qwen3-tts-base-int4/code2wav/code2wav.engine",
  "engines/qwen3-tts-base-int4/clone_encoders/speaker_encoder.engine",
  "engines/qwen3-tts-base-int4/clone_encoders/speech_tokenizer_encoder.engine",
]
provenance_required = true
sha256_required = true
