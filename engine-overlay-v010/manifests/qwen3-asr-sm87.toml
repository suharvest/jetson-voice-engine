[target]
device = "jetson-orin-nx"
sm = "87"
cuda = "12.6"
tensorrt = "10.3"
l4t = "36.4.3"
jetpack = "6.2"
embedded_target = "jetson-orin"
aarch64_build = true

[build]
type = "Release"
enable_cute_dsl = "fmha"
worker = "qwen3_asr_worker"

[model]
id = "Qwen/Qwen3-ASR-0.6B"
revision = "5eb144179a02acc5e5ba31e748d22b0cf3e303b0"
precision = "int4_awq"
upstream_supported_precision = false
product_extension = true
quantization_algorithm = "W4A16_AWQ"
quantization_group_size = 128
int4_gemm_plugin_version = 1
calibration_dataset = "librispeech"
calibration_samples = 128
audio_tower_precision = "fp16"
lm_head_quantized = false
components = ["thinker", "audio_encoder"]
batch_sizes = [1, 2]
max_input_len = 1024
max_kv_cache_capacity = 1536
long_context_opt_in_env = "ASR_LONG_CONTEXT"

[artifacts]
root = "/opt/edgellm-v010"
required = [
  "libNvInfer_edgellm_plugin.so",
  "bin/qwen3_asr_worker",
  "engines/qwen3-asr/thinker-b1/llm.engine",
  "engines/qwen3-asr/thinker-b2/llm.engine",
  "engines/qwen3-asr/audio_encoder/audio/audio_encoder.engine",
]
provenance_required = true
sha256_required = true
